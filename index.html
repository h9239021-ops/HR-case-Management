<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>사업장 사건관리 대시보드</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>

<!-- ============ 로그인 화면 ============ -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🗂️ 사업장 사건관리 대시보드</h1>
    <p class="muted">팀 계정으로 로그인하세요 (계정은 관리자가 Supabase에서 생성)</p>
    <input id="loginEmail" type="email" placeholder="이메일" />
    <input id="loginPassword" type="password" placeholder="비밀번호" />
    <button id="loginBtn" class="btn btn-primary">로그인</button>
    <p id="loginError" class="error-text"></p>
  </div>
</div>

<!-- ============ 앱 본체 ============ -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-title">🗂️ 사업장 사건관리 대시보드</div>
    <div class="topbar-right">
      <span id="userEmail" class="muted"></span>
      <button id="settingsBtn" class="btn btn-ghost">⚙️ 설정</button>
      <button id="logoutBtn" class="btn btn-ghost">로그아웃</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="summary">Home</button>
    <button class="tab-btn" data-tab="investigation">비위행위 조사</button>
    <button class="tab-btn" data-tab="report">조사 결과</button>
    <button class="tab-btn" data-tab="committee">인사위원회 개최</button>
    <button class="tab-btn" data-tab="notify">결과 통보</button>
  </nav>

  <main id="tabContent" class="tab-content"></main>
</div>

<!-- ============ 설정 모달 ============ -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <h2>⚙️ 설정</h2>
    <label>Claude API 키 (본인 계정 키, 브라우저에만 저장됩니다)</label>
    <input id="apiKeyInput" type="password" placeholder="sk-ant-..." />
    <label>모델명</label>
    <input id="modelInput" type="text" placeholder="예: claude-sonnet-4-5-20250929" />
    <p class="muted small">최신 모델명은 Anthropic 문서(docs.claude.com)에서 확인해 입력하세요.</p>
    <div class="modal-actions">
      <button id="settingsCancel" class="btn btn-ghost">취소</button>
      <button id="settingsSave" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<!-- ============ 사건 상세 모달 ============ -->
<div id="caseModal" class="modal hidden">
  <div class="modal-box modal-box-wide">
    <div id="caseModalContent"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
